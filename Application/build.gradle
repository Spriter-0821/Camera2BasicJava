// 模块级构建文件：配置 Application 这个 app 模块
// 现代化版本（从老的支持库配置迁移到 AndroidX + 现代工具链）

apply plugin: 'com.android.application'

android {
    namespace 'com.example.android.camera2basic'   // 包名（App 唯一标识，替代旧 manifest 里的 package 属性）
    compileSdk 36                                  // 用 Android 16 SDK 编译

    defaultConfig {
        applicationId "com.example.android.camera2basic"
        minSdk 21                                  // Camera2 API 最低需要 21（Android 5.0）
        targetSdk 36                               // 针对 Android 16 设计
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false                    // 学习项目不开混淆
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 源码目录：只保留 main（旧的 common/template 目录在本 sample 中不存在）
    sourceSets {
        main {
            java.srcDirs 'src/main/java'
            res.srcDirs 'src/main/res'
        }
        androidTest.setRoot('tests')
        androidTest.java.srcDirs = ['tests/src']
    }
}

dependencies {
    // 旧的 com.android.support:* 全部替换为对应的 AndroidX 库
    // appcompat 提供 AppCompatActivity；fragment 提供 DialogFragment/Fragment；core 提供 ActivityCompat/ContextCompat
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.core:core:1.13.1'
}

// AndroidX 库会传递依赖 Kotlin stdlib，新旧版本（1.8.22 合并版 vs 1.6.21 独立 jdk7/jdk8 模块）会产生重复类。
// 强制对齐到 1.8.22：该版本的 jdk7/jdk8 产物是空壳，不再含重复字节码。
configurations.all {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}
